<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yelarts</title>
  <meta name="description" content="Yelarts makes games and software.">
  <meta name="theme-color" content="#16130c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --ink: #16130c;
      --paper: #f4efe4;
      --yell: #ffe14a;
      --quiet: #b7ad98;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--ink);
      color: var(--paper);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.5rem 1.5rem 2.75rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(4.75rem, 18vw, 11.5rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.82;
    }

    .mark {
      width: 2.75rem;
      height: 0.45rem;
      margin: 1.35rem 0 1.1rem;
      background: var(--yell);
    }

    p {
      margin: 0;
      max-width: 18rem;
      font-size: 1.35rem;
      line-height: 1.35;
    }

    a {
      display: inline-block;
      margin-top: 1.75rem;
      color: var(--yell);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.01em;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.22em;
    }

    a:hover { color: var(--paper); }

    @media (min-width: 700px) {
      main { padding: 4rem 7vw 4.5rem; }
      p { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Yelarts</h1>
    <div class="mark" aria-hidden="true"></div>
    <p>Games and software. A game is on the way.</p>
    <a href="mailto:nick@yelarts.com">nick@yelarts.com</a>
  </main>
</body>
</html>
